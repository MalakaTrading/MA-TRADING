<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malaka Trading — Trade Redovisning</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Arial Black',Arial,sans-serif;}
body{background:#111;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px 16px;}
.outer{background:#1c1c1c;padding:20px 18px 16px;max-width:500px;width:100%;border-radius:12px;}
.topbar{background:#f9a825;height:5px;border-radius:3px;margin-bottom:14px;}
.logo-m{color:#fff;font-size:28px;font-weight:900;letter-spacing:4px;text-align:center;line-height:1;}
.logo-t{color:#00e676;font-size:28px;font-weight:900;letter-spacing:4px;text-align:center;line-height:1;margin-bottom:4px;}
.trade-subtitle{color:#aaa;font-size:12px;font-weight:900;text-align:center;letter-spacing:2px;margin-bottom:12px;}
.img-zone{background:#232323;border:2px dashed #444;border-radius:10px;width:100%;height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;margin-bottom:4px;overflow:hidden;position:relative;}
.img-zone img{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1);transform-origin:center;pointer-events:none;max-width:none;max-height:none;width:100%;}
.img-zone .placeholder{display:flex;flex-direction:column;align-items:center;gap:6px;z-index:2;}
.img-zone .plus{color:#555;font-size:36px;font-weight:900;line-height:1;}
.img-zone .plbl{color:#666;font-size:11px;letter-spacing:1px;}
.img-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;z-index:3;}
.zoom-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:0 2px;}
.zoom-lbl{font-size:9px;color:#888;letter-spacing:1px;white-space:nowrap;}
.zoom-slider{flex:1;accent-color:#00e676;}
.zoom-val{font-size:11px;color:#00e676;font-weight:900;min-width:36px;text-align:right;}
.result-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.result-btn{border:none;border-radius:7px;padding:9px 0;font-size:13px;font-weight:900;letter-spacing:2px;cursor:pointer;font-family:'Arial Black',Arial,sans-serif;opacity:0.4;transition:opacity .2s;}
.result-btn.active{opacity:1;}
.btn-win{background:#00c853;color:#fff;}
.btn-loss{background:#e53935;color:#fff;}
.btn-be{background:#ffa726;color:#fff;grid-column:span 2;}
.direction-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.dir-btn{border:none;border-radius:7px;padding:7px 0;font-size:12px;font-weight:900;letter-spacing:2px;cursor:pointer;font-family:'Arial Black',Arial,sans-serif;opacity:0.4;transition:opacity .2s;}
.dir-btn.active{opacity:1;}
.btn-long{background:#00c853;color:#fff;}
.btn-short{background:#e53935;color:#fff;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.inp-group{display:flex;flex-direction:column;gap:3px;}
.inp-group span{font-size:9px;color:#888;letter-spacing:1px;}
.inp-group input,.inp-group select{width:100%;background:#2a2a2a;border:1.5px solid #444;color:#fff;border-radius:6px;padding:6px 8px;font-size:13px;font-weight:900;font-family:'Arial Black',Arial,sans-serif;}
.inp-group input:focus,.inp-group select:focus{outline:none;border-color:#00e676;}
.inp-group select option{background:#2a2a2a;color:#fff;}
.divider{border:none;border-top:1px solid #2e2e2e;margin:10px 0;}
.result-card{background:#282828;border-radius:10px;padding:12px;margin-bottom:10px;}
.result-card .r-hdr{text-align:center;font-size:12px;font-weight:900;letter-spacing:2px;color:#fff;border-radius:5px;padding:4px 0;margin-bottom:10px;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:4px;}
.stat-val{font-size:16px;font-weight:900;}
.stat-lbl{font-size:9px;color:#888;letter-spacing:1px;margin-top:1px;}
.notes-inp{width:100%;background:#2a2a2a;border:1.5px solid #444;color:#fff;border-radius:7px;padding:8px;font-size:12px;font-family:'Arial Black',Arial,sans-serif;resize:none;margin-bottom:10px;}
.notes-inp:focus{outline:none;border-color:#00e676;}
.ticker-inp{width:100%;background:#2a2a2a;border:1.5px solid #444;color:#00e676;border-radius:6px;padding:6px 8px;font-size:15px;font-weight:900;text-align:center;letter-spacing:2px;font-family:'Arial Black',Arial,sans-serif;margin-bottom:10px;}
.ticker-inp:focus{outline:none;border-color:#00e676;}
.reset-btn{display:block;width:100%;background:transparent;border:1.5px solid #555;color:#888;border-radius:6px;padding:7px;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;margin-top:4px;font-family:'Arial Black',Arial,sans-serif;}
.reset-btn:hover{border-color:#00e676;color:#00e676;}
.footer{text-align:center;color:#555;font-size:10px;line-height:1.8;margin-top:8px;}
.hem-btn{display:block;width:100%;max-width:500px;margin:0 auto 12px;background:transparent;border:1.5px solid #333;color:#888;border-radius:7px;padding:7px;font-size:11px;font-weight:700;letter-spacing:1px;text-align:center;text-decoration:none;font-family:"Arial Black",Arial,sans-serif;}.hem-btn:hover{border-color:#00e676;color:#00e676;}
</style>
</head>
<body>
<div class="outer">
  <div class="topbar"></div>
  <div class="logo-m">MALAKA</div>
  <div class="logo-t">TRADING</div>
  <div class="trade-subtitle">TRADE REDOVISNING</div>

  <div class="img-zone" id="imgZone">
    <div class="placeholder" id="imgPlaceholder">
      <div class="plus">+</div>
      <div class="plbl">LADDA UPP TRADE-BILD</div>
    </div>
    <img id="tradeImg" style="display:none;" />
    <input type="file" accept="image/*" id="fileInput" onchange="loadImg(event)" />
  </div>

  <div class="zoom-row" id="zoomRow" style="display:none;">
    <span class="zoom-lbl">ZOOM</span>
    <input type="range" class="zoom-slider" id="zoomSlider" min="50" max="300" value="100" step="1" oninput="applyZoom()">
    <span class="zoom-val" id="zoomVal">100%</span>
  </div>

  <input class="ticker-inp" id="ticker" placeholder="MGC1! / MNQ1! / ..." oninput="update()" />

  <div class="direction-bar">
    <button class="dir-btn btn-long" id="btnLong" onclick="setDir('long')">LONG</button>
    <button class="dir-btn btn-short active" id="btnShort" onclick="setDir('short')">SHORT</button>
  </div>

  <div class="result-bar">
    <button class="result-btn btn-win" id="btnWin" onclick="setResult('win')">WIN</button>
    <button class="result-btn btn-loss active" id="btnLoss" onclick="setResult('loss')">LOSS</button>
    <button class="result-btn btn-be" id="btnBe" onclick="setResult('be')">BREAK EVEN</button>
  </div>

  <div class="info-grid">
    <div class="inp-group">
      <span>DATUM</span>
      <input type="date" id="tdate" oninput="update()">
    </div>
    <div class="inp-group">
      <span>TID (SVENSK)</span>
      <input type="time" id="ttime" oninput="update()">
    </div>
  </div>

  <div class="info-grid">
    <div class="inp-group">
      <span>INGÅNG</span>
      <input type="number" id="entry" placeholder="0.00" step="0.01" oninput="update()">
    </div>
    <div class="inp-group">
      <span>EXIT</span>
      <input type="number" id="exit" placeholder="0.00" step="0.01" oninput="update()">
    </div>
  </div>

  <div class="info-grid">
    <div class="inp-group">
      <span>RISK/REWARD</span>
      <select id="rr" onchange="update()">
        <option value="1:1">1:1</option>
        <option value="1:2">1:2</option>
        <option value="1:3">1:3</option>
        <option value="2:1">2:1</option>
        <option value="1:1.5">1:1.5</option>
        <option value="1:2.5">1:2.5</option>
      </select>
    </div>
    <div class="inp-group">
      <span>TICKS</span>
      <input type="number" id="ticks" placeholder="0" min="0" oninput="update()">
    </div>
  </div>

  <div class="divider"></div>

  <div class="result-card">
    <div class="r-hdr" id="rHdr" style="background:#e53935;">SHORT — LOSS</div>
    <div class="stats-row">
      <div><div class="stat-val" id="rTicker" style="color:#5bc8f5;">—</div><div class="stat-lbl">TICKER</div></div>
      <div><div class="stat-val" id="rEntry" style="color:#fff;">—</div><div class="stat-lbl">INGÅNG</div></div>
      <div><div class="stat-val" id="rExit" style="color:#fff;">—</div><div class="stat-lbl">EXIT</div></div>
      <div><div class="stat-val" id="rTicks" style="color:#ffa726;">—</div><div class="stat-lbl">TICKS</div></div>
    </div>
    <div style="margin-top:8px;" class="stats-row">
      <div><div class="stat-val" id="rRR" style="color:#5bc8f5;">—</div><div class="stat-lbl">R:R</div></div>
      <div><div class="stat-val" id="rDate" style="color:#aaa;font-size:11px;">—</div><div class="stat-lbl">DATUM</div></div>
      <div><div class="stat-val" id="rTime" style="color:#aaa;font-size:11px;">—</div><div class="stat-lbl">TID</div></div>
      <div><div class="stat-val" id="rPts" style="color:#ffa726;">—</div><div class="stat-lbl">PUNKTER</div></div>
    </div>
  </div>

  <textarea class="notes-inp" id="notes" rows="3" placeholder="Anteckningar om traden..."></textarea>

  <button class="reset-btn" onclick="resetForm()">NOLLSTÄLL TRADE</button>

  <div class="footer">
    Malaka Trading • MA-T Indikator • TradingView
  </div>
  <a href="index.html" style="display:block;width:100%;background:transparent;border:1.5px solid #333;color:#666;border-radius:6px;padding:7px;font-size:11px;font-weight:700;letter-spacing:1px;text-align:center;text-decoration:none;font-family:'Arial Black',Arial,sans-serif;margin-top:10px;">← TILLBAKA TILL START</a>
</div>

<script>
let dir='short', result='loss';

function setDir(d){
  dir=d;
  document.getElementById('btnLong').classList.toggle('active',d==='long');
  document.getElementById('btnShort').classList.toggle('active',d==='short');
  update();
}

function setResult(r){
  result=r;
  document.getElementById('btnWin').classList.toggle('active',r==='win');
  document.getElementById('btnLoss').classList.toggle('active',r==='loss');
  document.getElementById('btnBe').classList.toggle('active',r==='be');
  update();
}

function loadImg(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=document.getElementById('tradeImg');
    img.src=ev.target.result;
    img.style.display='block';
    document.getElementById('imgPlaceholder').style.display='none';
    document.getElementById('fileInput').style.zIndex='-1';
    document.getElementById('zoomRow').style.display='flex';
    document.getElementById('zoomSlider').value=100;
    document.getElementById('zoomVal').textContent='100%';
    img.style.transform='translate(-50%,-50%) scale(1)';
  };
  reader.readAsDataURL(file);
}

function applyZoom(){
  const val=document.getElementById('zoomSlider').value;
  document.getElementById('zoomVal').textContent=val+'%';
  document.getElementById('tradeImg').style.transform='translate(-50%,-50%) scale('+val/100+')';
}

function update(){
  const dirLbl=dir==='long'?'LONG':'SHORT';
  const resLbl=result==='win'?'WIN':result==='loss'?'LOSS':'BREAK EVEN';
  const resCol=result==='win'?'#00c853':result==='loss'?'#e53935':'#ffa726';
  document.getElementById('rHdr').textContent=dirLbl+' \u2014 '+resLbl;
  document.getElementById('rHdr').style.background=resCol;
  const ticker=document.getElementById('ticker').value||'—';
  const entry=document.getElementById('entry').value||'—';
  const exit=document.getElementById('exit').value||'—';
  const rr=document.getElementById('rr').value;
  const ticks=document.getElementById('ticks').value;
  const date=document.getElementById('tdate').value;
  const time=document.getElementById('ttime').value;
  const pts=ticks?(parseFloat(ticks)/10).toFixed(1).replace(/\.0$/,'')+'p':'—';
  document.getElementById('rTicker').textContent=ticker.toUpperCase();
  document.getElementById('rEntry').textContent=entry;
  document.getElementById('rExit').textContent=exit;
  document.getElementById('rTicks').textContent=ticks||'—';
  document.getElementById('rRR').textContent=rr;
  document.getElementById('rDate').textContent=date?date.split('-').reverse().join('/'):'—';
  document.getElementById('rTime').textContent=time||'—';
  document.getElementById('rPts').textContent=pts;
}

function resetForm(){
  document.getElementById('ticker').value='';
  document.getElementById('entry').value='';
  document.getElementById('exit').value='';
  document.getElementById('ticks').value='';
  document.getElementById('notes').value='';
  document.getElementById('tradeImg').style.display='none';
  document.getElementById('imgPlaceholder').style.display='flex';
  document.getElementById('fileInput').style.zIndex='3';
  document.getElementById('zoomRow').style.display='none';
  document.getElementById('zoomSlider').value=100;
  const today=new Date().toISOString().split('T')[0];
  document.getElementById('tdate').value=today;
  const now=new Date().toTimeString().slice(0,5);
  document.getElementById('ttime').value=now;
  setDir('short');
  setResult('loss');
}

const today=new Date().toISOString().split('T')[0];
document.getElementById('tdate').value=today;
const now=new Date().toTimeString().slice(0,5);
document.getElementById('ttime').value=now;
update();
</script>
</body>
</html>
